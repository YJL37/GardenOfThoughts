<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Little Garden</title>
    <style>
      :root {
        --ink: #414141;
        --paper: #fffdf9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eeeae6;
        color: var(--ink);
        font-family: "Trebuchet MS", system-ui, sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      #loginScreen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .login-card {
        width: min(420px, 100%);
        background: var(--paper);
        border: 1px solid #888;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
      }
      .field {
        text-align: left;
        margin: 14px 0;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
      }
      input,
      textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #aaa;
        border-radius: 9px;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .primary,
      .secondary {
        padding: 10px 13px;
        border: 1px solid #666;
        border-radius: 9px;
      }
      .primary {
        background: #414141;
        color: white;
      }
      .secondary {
        background: white;
      }
      .wide {
        width: 100%;
        margin-top: 8px;
      }
      .text-button {
        border: 0;
        background: none;
        text-decoration: underline;
        margin-top: 14px;
      }
      .error {
        color: #b44;
        min-height: 20px;
      }
      #app {
        padding: 28px 14px;
      }
      .shell {
        max-width: 920px;
        margin: auto;
      }
      header,
      .board-head,
      .admin-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      header {
        margin-bottom: 22px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .brand h2 {
        margin: 0;
      }
      .welcome,
      small,
      .meta {
        color: #888;
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        border: 1px solid #888;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
        padding: 10px 22px;
        background: #eeeae6;
      }
      .tab.active {
        background: var(--paper);
      }
      .board {
        background: var(--paper);
        border: 1px solid #888;
        border-radius: 0 12px 12px 12px;
        min-height: 550px;
        padding: 24px;
      }
      .board-head {
        margin-bottom: 22px;
      }
      .board-head h3 {
        font-weight: 500;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px;
      }
      .note-card {
        background: white;
        border: 1px solid #777;
        padding: 16px;
        min-height: 175px;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .plant {
        font-size: 30px;
        margin-bottom: 10px;
      }
      .question,
      .answer {
        font-size: 14px;
        white-space: pre-wrap;
        line-height: 1.45;
      }
      .answer {
        border-top: 1px dashed #bbb;
        padding-top: 10px;
        margin-top: 10px;
      }
      .meta {
        text-align: right;
        margin-top: 12px;
      }
      .empty {
        text-align: center;
        color: #999;
        padding: 70px 10px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #0004;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .modal {
        width: min(560px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--paper);
        border: 1px solid #888;
        border-radius: 15px;
        padding: 24px;
      }
      .modal-head,
      .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .modal-actions {
        justify-content: flex-end;
        margin-top: 12px;
      }
      .type-choice {
        display: flex;
        gap: 12px;
        margin: 14px 0;
      }
      .type-choice label {
        border: 1px solid #aaa;
        border-radius: 9px;
        padding: 9px;
      }
      .type-choice input {
        width: auto;
      }
      .admin-section {
        margin-bottom: 25px;
      }
      .admin-note {
        border: 1px solid #bbb;
        border-radius: 10px;
        padding: 13px;
        margin: 10px 0;
        background: white;
        overflow-wrap: anywhere;
      }
      .reply-area {
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .board {
          padding: 15px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        header {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <section id="loginScreen">
      <div class="login-card">
        <div style="font-size: 46px">🌱</div>
        <h1>Little Garden</h1>
        <p>A place for questions to grow.</p>
        <div id="loginForm">
          <div class="field">
            <label>Username</label>
            <input id="loginUsername" autocomplete="username" />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <button class="primary wide" onclick="login()">Log in</button>
          <button class="text-button" onclick="showSignup()">
            Create an account
          </button>
          <div id="loginError" class="error"></div>
        </div>
        <div id="signupForm" class="hidden">
          <div class="field">
            <label>Choose username (3–24 characters)</label>
            <input id="signupUsername" maxlength="24" autocomplete="username" />
          </div>
          <div class="field">
            <label>Password (at least 8 characters)</label>
            <input
              id="signupPassword"
              type="password"
              autocomplete="new-password"
            />
          </div>
          <button class="primary wide" onclick="signup()">
            Create account
          </button>
          <button class="text-button" onclick="showLogin()">
            Back to login
          </button>
          <div id="signupError" class="error"></div>
        </div>
      </div>
    </section>

    <section id="app" class="hidden">
      <div class="shell">
        <header>
          <div class="brand">
            <span style="font-size: 32px">🌿</span>
            <div>
              <h2>Little Garden</h2>
              <div id="welcomeText" class="welcome"></div>
            </div>
          </div>
          <div>
            <span id="adminBadge" class="hidden">Admin · </span>
            <button class="secondary" onclick="logout()">Log out</button>
          </div>
        </header>

        <div class="tabs">
          <button
            id="personalTab"
            class="tab active"
            onclick="switchTab('personal')"
          >
            Personal</button
          ><button id="publicTab" class="tab" onclick="switchTab('public')">
            Public</button
          ><button
            id="adminTab"
            class="tab hidden"
            onclick="switchTab('admin')"
          >
            Admin
          </button>
        </div>
        <main id="board" class="board"></main>
      </div>
    </section>
    <div id="noteModal" class="overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3 id="modalTitle">Plant a note</h3>
            <p id="modalSubtitle"></p>
          </div>
          <button class="secondary" onclick="closeModal()">×</button>
        </div>
        <div id="newNoteFields">
          <div class="type-choice">
            <label
              ><input type="radio" name="noteType" value="public" checked /> 🌱
              Public</label
            ><label
              ><input type="radio" name="noteType" value="private" /> 🔒
              Private</label
            >
          </div>
          <textarea
            id="noteText"
            maxlength="5000"
            placeholder="Write your question or note..."
          ></textarea>
          <div class="modal-actions">
            <button class="secondary" onclick="closeModal()">Cancel</button
            ><button class="primary" onclick="submitNote()">Plant note</button>
          </div>
        </div>
        <div id="viewNoteFields" class="hidden"></div>
      </div>
    </div>
    <script>
      let me = null,
        tab = "personal";
      const $ = (id) => document.getElementById(id);
      async function api(path, opts = {}) {
        const r = await fetch("/api" + path, {
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            ...(opts.headers || {}),
          },
          ...opts,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(d.error || "Request failed");
        return d;
      }
      function esc(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      function date(s) {
        return new Date(s).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }
      function showSignup() {
        $("loginForm").classList.add("hidden");
        $("signupForm").classList.remove("hidden");
        $("loginError").textContent = "";
        $("signupError").textContent = "";
      }
      function showLogin() {
        $("signupForm").classList.add("hidden");
        $("loginForm").classList.remove("hidden");
        $("signupError").textContent = "";
      }
      async function signup() {
        try {
          await api("/auth/signup", {
            method: "POST",
            body: JSON.stringify({
              username: $("signupUsername").value.trim(),
              password: $("signupPassword").value,
            }),
          });
          showLogin();
          $("loginError").textContent = "Account created! Please log in.";
        } catch (e) {
          $("signupError").textContent = e.message;
        }
      }
      async function login() {
        try {
          me = await api("/auth/login", {
            method: "POST",
            body: JSON.stringify({
              username: $("loginUsername").value.trim(),
              password: $("loginPassword").value,
            }),
          });
          await startApp();
        } catch (e) {
          $("loginError").textContent = e.message;
        }
      }
      async function logout() {
        try {
          await api("/auth/logout", { method: "POST", body: "{}" });
        } catch {}
        me = null;
        $("app").classList.add("hidden");
        $("loginScreen").classList.remove("hidden");
        $("loginPassword").value = "";
        showLogin();
      }
      async function startApp() {
        $("loginScreen").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("welcomeText").textContent = "Hello, " + me.username;
        $("adminBadge").classList.toggle("hidden", me.role !== "admin");
        $("adminTab").classList.toggle("hidden", me.role !== "admin");
        await switchTab("personal");
      }
      async function switchTab(t) {
        if (t === "admin" && me?.role !== "admin") return;
        tab = t;
        ["personal", "public", "admin"].forEach((x) =>
          $(x + "Tab").classList.toggle("active", x === t),
        );
        try {
          await render();
        } catch (e) {
          $("board").textContent = e.message;
        }
      }
      async function render() {
        const b = $("board");
        if (tab === "admin") {
          renderAdmin(b, await api("/admin/notes"));
          return;
        }
        const ns = await api(
          tab === "public" ? "/notes/public" : "/notes/private",
        );
        b.innerHTML = `<div class="board-head"><h3>${tab === "public" ? "Public garden" : "Your notes"}</h3><button class="secondary" onclick="newNote()">＋ New note</button></div><div class="cards">${ns.length ? ns.map(card).join("") : `<div class="empty" style="grid-column:1/-1">🌱<br><br>${tab === "public" ? "The garden is waiting for its first note." : "You haven't planted a private note yet."}</div>`}</div>`;
      }
      function card(n) {
        return `<article class="note-card" onclick="viewNote('${n._id}')"><div class="plant">${n.response ? "🌸" : "🌱"}</div><div class="question">Q: ${esc(n.text)}</div>${n.response ? `<div class="answer">A: ${esc(n.response)}</div>` : ""}<div class="meta">${date(n.createdAt)}</div></article>`;
      }
      function renderAdmin(b, ns) {
        const open = ns.filter((n) => !n.response),
          done = ns.filter((n) => n.response);
        b.innerHTML = `<div class="board-head"><h3>Admin garden</h3></div><section class="admin-section"><h4>🌱 Waiting for an answer (${open.length})</h4>${open.length ? open.map(adminCard).join("") : '<div class="empty">Everything is answered 🌸</div>'}</section><section class="admin-section"><h4>🌸 Answered (${done.length})</h4>${done.map(adminCard).join("")}</section>`;
      }
      function adminCard(n) {
        return `<div class="admin-note"><div class="admin-row"><b>${n.type === "public" ? "🌍 Public" : "🔒 Private"}</b><small>from ${esc(n.authorUsername)} · ${date(n.createdAt)}</small></div><p><b>Q:</b> ${esc(n.text)}</p>${n.response ? `<p><b>A:</b> ${esc(n.response)}</p>` : `<div class="reply-area"><textarea id="reply-${n._id}" maxlength="5000" placeholder="Write your answer..."></textarea><div class="modal-actions"><button class="secondary" onclick="deleteNote('${n._id}')">Delete</button><button class="primary" onclick="answer('${n._id}')">Answer 🌸</button></div></div>`}</div>`;
      }
      function newNote() {
        $("noteModal").classList.remove("hidden");
        $("newNoteFields").classList.remove("hidden");
        $("viewNoteFields").classList.add("hidden");
        $("modalTitle").textContent = "Plant a note";
        $("modalSubtitle").textContent = "Choose who can see your note.";
        $("noteText").value = "";
      }
      function closeModal() {
        $("noteModal").classList.add("hidden");
      }
      async function submitNote() {
        const text = $("noteText").value.trim(),
          type = document.querySelector("[name=noteType]:checked").value;
        if (!text) return alert("Please write something first.");
        try {
          await api("/notes", {
            method: "POST",
            body: JSON.stringify({ text, type }),
          });
          closeModal();
          await switchTab(type === "public" ? "public" : "personal");
        } catch (e) {
          alert(e.message);
        }
      }
      async function viewNote(id) {
        try {
          const n = await api("/notes/" + encodeURIComponent(id));
          $("noteModal").classList.remove("hidden");
          $("newNoteFields").classList.add("hidden");
          $("viewNoteFields").classList.remove("hidden");
          $("modalTitle").textContent = n.response
            ? "🌷 Answered note"
            : "🌱 Note";
          $("modalSubtitle").textContent =
            n.type === "public" ? "Public" : "Private";
          $("viewNoteFields").innerHTML =
            `<div class="admin-note"><small>From ${esc(n.authorUsername)} · ${date(n.createdAt)}</small><p><b>Q:</b></p><p>${esc(n.text)}</p>${n.response ? `<div class="answer"><b>A:</b><p>${esc(n.response)}</p></div>` : "<p>🌱 Waiting for an answer...</p>"}</div>`;
        } catch (e) {
          alert(e.message);
        }
      }
      async function answer(id) {
        const response = $("reply-" + id).value.trim();
        if (!response) return alert("Write an answer first.");
        try {
          await api("/admin/notes/" + id + "/answer", {
            method: "POST",
            body: JSON.stringify({ response }),
          });
          await render();
        } catch (e) {
          alert(e.message);
        }
      }
      async function deleteNote(id) {
        if (!confirm("Delete this note?")) return;
        try {
          await api("/admin/notes/" + id, { method: "DELETE" });
          await render();
        } catch (e) {
          alert(e.message);
        }
      }
      (async () => {
        try {
          me = await api("/auth/me");
          await startApp();
        } catch {}
      })();
    </script>
  </body>
</html>
