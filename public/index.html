<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Garden of Thoughts</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap");

      :root {
        --ink: #28465e;
        --paper: #ffffff;
        --sky: #bfe5ff;
        --sky-light: #dff2ff;
        --sky-deep: #8dcaf2;
        --outline: #527e9d;
        --shadow: #8ab9d8;
        --pink: #f7d8e8;
        --mint: #d5f1e6;
        --lilac: #e8e0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: #dff2ff;
        background-image: url("images/sky-tile2.png");
        background-repeat: repeat;
        background-position: top left;
        background-size: 440px 440px;
        color: var(--ink);
        font-family: "VT323", "Courier New", monospace;
        font-size: 20px;
      }

      h1,
      h2,
      h3,
      h4,
      .tab,
      button,
      .brand h2 {
        font-family: "Press Start 2P", "Courier New", monospace;
        line-height: 1.6;
      }

      h1 {
        font-size: clamp(17px, 3vw, 24px);
      }

      h2 {
        font-size: clamp(13px, 2vw, 17px);
      }

      h3 {
        font-size: 13px;
      }

      h4 {
        font-size: 10px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px dashed #477fa6;
        outline-offset: 3px;
      }

      .hidden {
        display: none !important;
      }

      #loginScreen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .login-card {
        width: min(440px, 100%);
        background: var(--paper);
        border: 4px solid var(--outline);
        box-shadow: 8px 8px 0 var(--shadow);
        padding: 30px;
        text-align: center;
      }

      .field {
        text-align: left;
        margin: 14px 0;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
      }

      input,
      textarea {
        width: 100%;
        padding: 11px;
        border: 3px solid var(--outline);
        border-radius: 0;
        background: #f7fcff;
        color: var(--ink);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .primary,
      .secondary {
        min-height: 46px;
        padding: 10px 13px;
        border: 3px solid var(--outline);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--shadow);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }

      .primary {
        background: var(--sky-deep);
        color: #183b54;
      }

      .secondary {
        background: var(--sky-light);
        color: var(--ink);
      }

      .primary:hover,
      .secondary:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0 var(--shadow);
      }

      .primary:active,
      .secondary:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--shadow);
      }

      .wide {
        width: 100%;
        margin-top: 8px;
      }

      .text-button {
        border: 0;
        background: none;
        color: #356d94;
        text-decoration: underline;
        margin-top: 14px;
        font-family: "VT323", monospace;
        font-size: 22px;
      }

      .error {
        color: #b23b68;
        min-height: 20px;
      }

      #app {
        padding: 28px 14px;
      }

      .shell {
        max-width: 920px;
        margin: auto;
      }

      header,
      .board-head,
      .admin-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      header {
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .brand h2 {
        margin: 0;
      }

      .welcome,
      small,
      .meta {
        color: #64839a;
        font-size: 16px;
      }

      /* PIXEL FOLDER TABS */
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 0;
        padding-left: 8px;
      }

      .tab {
        min-height: 54px;
        padding: 10px 18px;
        border: 3px solid var(--outline);
        border-bottom: 0;
        background: var(--sky);
        color: #315e7b;
        box-shadow: 4px 0 0 rgba(82, 126, 157, 0.12);
        font-size: 9px;
        margin-top: 7px;
        position: relative;
        z-index: 1;
      }

      .tab + .tab {
        margin-left: -3px;
      }

      .tab:hover {
        background: #d5edff;
      }

      /* The selected folder is white */

      .tab.active {
        background: var(--paper);
        color: #28465e;
        margin-top: 0;
        min-height: 61px;
        position: relative;
        z-index: 3;
        box-shadow: none;
        border-bottom: 3px solid var(--paper);
        margin-bottom: -3px;
      }

      .board {
        position: relative;
        background: var(--paper);
        border: 3px solid var(--outline);
        box-shadow: 7px 7px 0 var(--shadow);
        min-height: 550px;
        padding: 24px;
      }

      .board-head {
        margin-bottom: 22px;
      }

      .board-head h3 {
        font-weight: normal;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px;
      }

      .note-card {
        background: #f4fbff;
        border: 3px solid #83b6d8;
        box-shadow: 4px 4px 0 #c0e2f7;
        padding: 16px;
        min-height: 175px;
        cursor: pointer;
        overflow-wrap: anywhere;
      }

      .note-card:nth-child(3n + 2) {
        background: #f5f1ff;
        border-color: #b6a8e6;
        box-shadow: 4px 4px 0 #ddd4ff;
      }

      .note-card:nth-child(3n) {
        background: #f0fbf6;
        border-color: #8dcbb3;
        box-shadow: 4px 4px 0 #cceee0;
      }

      .plant {
        font-size: 30px;
        margin-bottom: 10px;
        image-rendering: pixelated;
      }

      .question,
      .answer {
        font-size: 22px;
        white-space: pre-wrap;
        line-height: 1.25;
      }

      .answer {
        border-top: 2px dashed #9bbdd3;
        padding-top: 10px;
        margin-top: 10px;
      }

      .meta {
        text-align: right;
        margin-top: 12px;
      }

      .empty {
        text-align: center;
        color: #64839a;
        padding: 70px 10px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(39, 76, 105, 0.38);
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .modal {
        width: min(560px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--paper);
        border: 4px solid var(--outline);
        box-shadow: 8px 8px 0 var(--shadow);
        padding: 24px;
      }

      .modal-head,
      .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .modal-actions {
        justify-content: flex-end;
        margin-top: 12px;
      }

      .type-choice {
        display: flex;
        gap: 12px;
        margin: 14px 0;
      }

      .type-choice label {
        border: 3px solid #9bbdd3;
        background: var(--sky-light);
        padding: 9px;
      }

      .type-choice input {
        width: auto;
      }

      .admin-section {
        margin-bottom: 25px;
      }

      .admin-note {
        border: 3px solid #9bbdd3;
        padding: 13px;
        margin: 10px 0;
        background: #f5fbff;
        overflow-wrap: anywhere;
      }

      .reply-area {
        margin-top: 12px;
      }

      @media (max-width: 600px) {
        .board {
          padding: 15px;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        header {
          align-items: flex-start;
        }

        .tabs {
          padding-left: 0;
        }

        .tab {
          flex: 1;
          padding: 8px 5px;
          font-size: 7px;
        }

        .board-head {
          align-items: flex-start;
        }

        .board-head .secondary {
          max-width: 48%;
        }

        .login-card {
          padding: 22px;
        }

        .modal {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <section id="loginScreen">
      <div class="login-card">
        <div style="font-size: 46px">🌱</div>
        <h1>Garden of Thoughts</h1>
        <p>A place for questions to grow.</p>
        <div id="loginForm">
          <div class="field">
            <label>Username</label>
            <input id="loginUsername" autocomplete="username" />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <button class="primary wide" onclick="login()">Log in</button>
          <button class="text-button" onclick="showSignup()">
            Create an account
          </button>
          <div id="loginError" class="error"></div>
        </div>
        <div id="signupForm" class="hidden">
          <div class="field">
            <label>Choose username (3–24 characters)</label>
            <input id="signupUsername" maxlength="24" autocomplete="username" />
          </div>
          <div class="field">
            <label>Password (at least 8 characters)</label>
            <input
              id="signupPassword"
              type="password"
              autocomplete="new-password"
            />
          </div>
          <button class="primary wide" onclick="signup()">
            Create account
          </button>
          <button class="text-button" onclick="showLogin()">
            Back to login
          </button>
          <div id="signupError" class="error"></div>
        </div>
      </div>
    </section>

    <section id="app" class="hidden">
      <div class="shell">
        <header>
          <div class="brand">
            <span style="font-size: 32px">🌿</span>
            <div>
              <h2>Garden of Thoughts</h2>
              <div id="welcomeText" class="welcome"></div>
            </div>
          </div>
          <div>
            <span id="adminBadge" class="hidden">Admin · </span>
            <button class="secondary" onclick="logout()">Log out</button>
          </div>
        </header>

        <div class="tabs">
          <button
            id="personalTab"
            class="tab active"
            onclick="switchTab('personal')"
          >
            Personal</button
          ><button id="publicTab" class="tab" onclick="switchTab('public')">
            Public</button
          ><button
            id="adminTab"
            class="tab hidden"
            onclick="switchTab('admin')"
          >
            Admin
          </button>
        </div>
        <main id="board" class="board"></main>
      </div>
    </section>
    <div id="noteModal" class="overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3 id="modalTitle">Plant a note</h3>
            <p id="modalSubtitle"></p>
          </div>
          <button class="secondary" onclick="closeModal()">×</button>
        </div>
        <div id="newNoteFields">
          <div class="type-choice">
            <label
              ><input type="radio" name="noteType" value="public" checked /> 🌱
              Public</label
            ><label
              ><input type="radio" name="noteType" value="private" /> 🔒
              Private</label
            >
          </div>
          <textarea
            id="noteText"
            maxlength="5000"
            placeholder="Write your question or note..."
          ></textarea>
          <div class="modal-actions">
            <button class="secondary" onclick="closeModal()">Cancel</button
            ><button class="primary" onclick="submitNote()">Plant note</button>
          </div>
        </div>
        <div id="viewNoteFields" class="hidden"></div>
      </div>
    </div>
    <script>
      let me = null,
        tab = "personal";
      const $ = (id) => document.getElementById(id);
      async function api(path, opts = {}) {
        const r = await fetch("/api" + path, {
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            ...(opts.headers || {}),
          },
          ...opts,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(d.error || "Request failed");
        return d;
      }
      function esc(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      function date(s) {
        return new Date(s).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }
      function showSignup() {
        $("loginForm").classList.add("hidden");
        $("signupForm").classList.remove("hidden");
        $("loginError").textContent = "";
        $("signupError").textContent = "";
      }
      function showLogin() {
        $("signupForm").classList.add("hidden");
        $("loginForm").classList.remove("hidden");
        $("signupError").textContent = "";
      }
      async function signup() {
        try {
          await api("/auth/signup", {
            method: "POST",
            body: JSON.stringify({
              username: $("signupUsername").value.trim(),
              password: $("signupPassword").value,
            }),
          });
          showLogin();
          $("loginError").textContent = "Account created! Please log in.";
        } catch (e) {
          $("signupError").textContent = e.message;
        }
      }
      async function login() {
        try {
          me = await api("/auth/login", {
            method: "POST",
            body: JSON.stringify({
              username: $("loginUsername").value.trim(),
              password: $("loginPassword").value,
            }),
          });
          await startApp();
        } catch (e) {
          $("loginError").textContent = e.message;
        }
      }
      async function logout() {
        try {
          await api("/auth/logout", { method: "POST", body: "{}" });
        } catch {}
        me = null;
        $("app").classList.add("hidden");
        $("loginScreen").classList.remove("hidden");
        $("loginPassword").value = "";
        showLogin();
      }
      async function startApp() {
        $("loginScreen").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("welcomeText").textContent = "Hello, " + me.username;
        $("adminBadge").classList.toggle("hidden", me.role !== "admin");
        $("adminTab").classList.toggle("hidden", me.role !== "admin");
        await switchTab("personal");
      }
      async function switchTab(t) {
        if (t === "admin" && me?.role !== "admin") return;
        tab = t;
        ["personal", "public", "admin"].forEach((x) =>
          $(x + "Tab").classList.toggle("active", x === t),
        );
        try {
          await render();
        } catch (e) {
          $("board").textContent = e.message;
        }
      }
      async function render() {
        const b = $("board");
        if (tab === "admin") {
          renderAdmin(b, await api("/admin/notes"));
          return;
        }
        const ns = await api(
          tab === "public" ? "/notes/public" : "/notes/private",
        );
        b.innerHTML = `<div class="board-head"><h3>${tab === "public" ? "Public garden" : "Your garden"}</h3><button class="secondary" onclick="newNote()">＋ New note</button></div><div class="cards">${ns.length ? ns.map(card).join("") : `<div class="empty" style="grid-column:1/-1">🌱<br><br>${tab === "public" ? "The garden is waiting for its first note." : "You haven't planted a private note yet."}</div>`}</div>`;
      }
      function card(n) {
        return `<article class="note-card" onclick="viewNote('${n._id}')"><div class="plant">${n.response ? "🌷" : "🌱"}</div><div class="question">Q: ${esc(n.text)}</div>${n.response ? `<div class="answer">A: ${esc(n.response)}</div>` : ""}<div class="meta">${date(n.createdAt)}</div></article>`;
      }
      function renderAdmin(b, ns) {
        const open = ns.filter((n) => !n.response),
          done = ns.filter((n) => n.response);
        b.innerHTML = `<div class="board-head"><h3>Admin garden</h3></div><section class="admin-section"><h4>🌱 Waiting for an answer (${open.length})</h4>${open.length ? open.map(adminCard).join("") : '<div class="empty">Everything is answered 🌷</div>'}</section><section class="admin-section"><h4>🌷 Answered (${done.length})</h4>${done.map(adminCard).join("")}</section>`;
      }
      function adminCard(n) {
        return `<div class="admin-note"><div class="admin-row"><b>${n.type === "public" ? "🌍 Public" : "🔒 Private"}</b><small>from ${esc(n.authorUsername)} · ${date(n.createdAt)}</small></div><p><b>Q:</b> ${esc(n.text)}</p>${n.response ? `<p><b>A:</b> ${esc(n.response)}</p>` : `<div class="reply-area"><textarea id="reply-${n._id}" maxlength="5000" placeholder="Write your answer..."></textarea><div class="modal-actions"><button class="secondary" onclick="deleteNote('${n._id}')">Delete</button><button class="primary" onclick="answer('${n._id}')">Answer 🌷</button></div></div>`}</div>`;
      }
      function newNote() {
        $("noteModal").classList.remove("hidden");
        $("newNoteFields").classList.remove("hidden");
        $("viewNoteFields").classList.add("hidden");
        $("modalTitle").textContent = "Plant a note";
        $("modalSubtitle").textContent = "Choose who can see your note.";
        $("noteText").value = "";
      }
      function closeModal() {
        $("noteModal").classList.add("hidden");
      }
      async function submitNote() {
        const text = $("noteText").value.trim(),
          type = document.querySelector("[name=noteType]:checked").value;
        if (!text) return alert("Please write something first.");
        try {
          await api("/notes", {
            method: "POST",
            body: JSON.stringify({ text, type }),
          });
          closeModal();
          await switchTab(type === "public" ? "public" : "personal");
        } catch (e) {
          alert(e.message);
        }
      }
      async function viewNote(id) {
        try {
          const n = await api("/notes/" + encodeURIComponent(id));
          $("noteModal").classList.remove("hidden");
          $("newNoteFields").classList.add("hidden");
          $("viewNoteFields").classList.remove("hidden");
          $("modalTitle").textContent = n.response
            ? "🌷 Answered Note"
            : "🌱 Note";
          $("modalSubtitle").textContent =
            n.type === "public" ? "Public" : "Private";
          $("viewNoteFields").innerHTML =
            `<div class="admin-note"><small>From ${esc(n.authorUsername)} · ${date(n.createdAt)}</small><p><b>Q:</b></p><p>${esc(n.text)}</p>${n.response ? `<div class="answer"><b>A:</b><p>${esc(n.response)}</p></div>` : "<p>🌱 Waiting for an answer...</p>"}</div>`;
        } catch (e) {
          alert(e.message);
        }
      }
      async function answer(id) {
        const response = $("reply-" + id).value.trim();
        if (!response) return alert("Write an answer first.");
        try {
          await api("/admin/notes/" + id + "/answer", {
            method: "POST",
            body: JSON.stringify({ response }),
          });
          await render();
        } catch (e) {
          alert(e.message);
        }
      }
      async function deleteNote(id) {
        if (!confirm("Delete this note?")) return;
        try {
          await api("/admin/notes/" + id, { method: "DELETE" });
          await render();
        } catch (e) {
          alert(e.message);
        }
      }
      (async () => {
        try {
          me = await api("/auth/me");
          await startApp();
        } catch {}
      })();
    </script>
  </body>
</html>
